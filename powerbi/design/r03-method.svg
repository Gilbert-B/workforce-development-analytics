<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2=".35"><stop offset="0" stop-color="#1A1238"/><stop offset="1" stop-color="#5B3FA8"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity=".07"/></pattern><radialGradient id="glow" cx="92%" cy="100%" r="55%"><stop offset="0" stop-color="#5B3FA8" stop-opacity=".07"/><stop offset="1" stop-color="#5B3FA8" stop-opacity="0"/></radialGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#17132B" flood-opacity=".08"/></filter></defs><rect width="1920" height="1080" fill="#F4F3F9"/><rect width="1920" height="1080" fill="url(#glow)"/><rect x="0" y="0" width="1920" height="232" fill="url(#hero)"/><rect x="0" y="0" width="1920" height="232" fill="url(#dots)"/><circle cx="1760" cy="-30" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/><circle cx="1760" cy="-30" r="240" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5"/><circle cx="1760" cy="-30" r="330" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/><circle cx="1760" cy="-30" r="420" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1.5"/><rect x="48" y="34" width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity=".14" stroke="#FFFFFF" stroke-opacity=".25"/><g transform="translate(61,47) scale(1.0833333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></g><text x="120" y="52" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#D5CBF2" fill-opacity="1.0" letter-spacing="1.4" text-anchor="start">WORKFORCE OUTCOMES &amp; TRAINING EFFECTIVENESS · REPORT 03 OF 3</text><text x="120" y="90" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Method and definitions</text><rect x="1452" y="34" width="420" height="40" rx="20" fill="#FFFFFF" fill-opacity=".10" stroke="#FFFFFF" stroke-opacity=".22"/><rect x="48" y="212" width="904" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="68" y="234" width="4" height="20" rx="2" fill="#5B3FA8"/><text x="82" y="250" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">The question</text><circle cx="87" cy="299.2" r="3" fill="#5B3FA8"/><text x="102" y="304" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Report 01 follows trainees through an 8-week academy. Report 02 follows the operations team. This</text><text x="102" y="325.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">report joins the two: for each graduate, how did training go, and how did their first 90 days in</text><text x="102" y="346.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">operations go?</text><circle cx="87" cy="372.3" r="3" fill="#5B3FA8"/><text x="102" y="377.1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">109 graduates were deployed between Oct 2026 and Mar 2027; every one has reached day 90 by the</text><text x="102" y="398.1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">snapshot.</text><rect x="968" y="212" width="904" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="988" y="234" width="4" height="20" rx="2" fill="#5B3FA8"/><text x="1002" y="250" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Windows and the honest-window rule</text><circle cx="1007" cy="299.2" r="3" fill="#5B3FA8"/><text x="1022" y="304" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Days 1-30, 31-60 and 61-90 after the graduate's first day in operations.</text><circle cx="1007" cy="330.2" r="3" fill="#5B3FA8"/><text x="1022" y="335.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">A window counts only if it ended by the snapshot AND the graduate was still employed at its end.</text><circle cx="1007" cy="361.3" r="3" fill="#5B3FA8"/><text x="1022" y="366.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Otherwise it is 'Not yet reached' or 'Left before window end' and its metrics are blank: an exit</text><text x="1022" y="387.1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">never becomes a zero-performance month.</text><circle cx="1007" cy="413.3" r="3" fill="#5B3FA8"/><text x="1022" y="418.1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Retention uses observed employment periods only.</text><rect x="48" y="637" width="904" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="68" y="659" width="4" height="20" rx="2" fill="#5B3FA8"/><text x="82" y="675" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Proficiency standard</text><circle cx="87" cy="724.2" r="3" fill="#5B3FA8"/><text x="102" y="729" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">A complete window with SLA met ≥ 80% AND first-time right ≥ 97%, close to tenured agents' level (84%</text><text x="102" y="750.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">/ 98%) less a small tolerance.</text><circle cx="87" cy="776.3" r="3" fill="#5B3FA8"/><text x="102" y="781.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Days to proficiency = the end of the first window that meets it (30, 60 or 90).</text><circle cx="87" cy="807.3" r="3" fill="#5B3FA8"/><text x="102" y="812.1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Training attributes: final competency (latest week with all five competencies scored), attendance</text><text x="102" y="833.1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">(present ÷ recorded), both mandatory certifications passed at attempt 1, ever on the watch list.</text><rect x="968" y="637" width="904" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="988" y="659" width="4" height="20" rx="2" fill="#5B3FA8"/><text x="1002" y="675" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Read with care</text><circle cx="1007" cy="724.2" r="3" fill="#5B3FA8"/><text x="1022" y="729" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Synthetic data: the simulation builds in a MODERATE link between training and early performance, with</text><text x="1022" y="750.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">large individual variation, as real studies typically find.</text><circle cx="1007" cy="776.3" r="3" fill="#5B3FA8"/><text x="1022" y="781.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Associations, not causes. Groups are small (about 36 graduates per competency third).</text><circle cx="1007" cy="807.3" r="3" fill="#5B3FA8"/><text x="1022" y="812.1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Benchmarks are tenured agents across the whole period, filtered by the same team/queue only on Report</text><text x="1022" y="833.1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">02.</text></svg>