<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2=".35"><stop offset="0" stop-color="#1A1238"/><stop offset="1" stop-color="#5B3FA8"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity=".07"/></pattern><radialGradient id="glow" cx="92%" cy="100%" r="55%"><stop offset="0" stop-color="#5B3FA8" stop-opacity=".07"/><stop offset="1" stop-color="#5B3FA8" stop-opacity="0"/></radialGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#17132B" flood-opacity=".08"/></filter></defs><rect width="1920" height="1080" fill="#F4F3F9"/><rect width="1920" height="1080" fill="url(#glow)"/><rect x="0" y="0" width="1920" height="232" fill="url(#hero)"/><rect x="0" y="0" width="1920" height="232" fill="url(#dots)"/><circle cx="1760" cy="-30" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/><circle cx="1760" cy="-30" r="240" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5"/><circle cx="1760" cy="-30" r="330" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/><circle cx="1760" cy="-30" r="420" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1.5"/><rect x="48" y="34" width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity=".14" stroke="#FFFFFF" stroke-opacity=".25"/><g transform="translate(61,47) scale(1.0833333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></g><text x="120" y="52" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#D5CBF2" fill-opacity="1.0" letter-spacing="1.4" text-anchor="start">WORKFORCE OUTCOMES &amp; TRAINING EFFECTIVENESS · REPORT 03 OF 3</text><text x="120" y="90" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Does training predict early performance?</text><rect x="1452" y="34" width="420" height="40" rx="20" fill="#FFFFFF" fill-opacity=".10" stroke="#FFFFFF" stroke-opacity=".22"/><text x="1102" y="108" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#D5CBF2" fill-opacity="1.0" letter-spacing="1.2" text-anchor="start">ACADEMY COHORT</text><text x="1348" y="108" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#D5CBF2" fill-opacity="1.0" letter-spacing="1.2" text-anchor="start">TEAM</text><text x="1614" y="108" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#D5CBF2" fill-opacity="1.0" letter-spacing="1.2" text-anchor="start">QUEUE</text><rect x="48" y="212" width="597" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="68" y="234" width="4" height="20" rx="2" fill="#5B3FA8"/><text x="82" y="250" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">SLA met by final training competency</text><text x="82" y="272" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E5A73" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Graduates split into thirds by final competency score</text><rect x="661" y="212" width="597" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="681" y="234" width="4" height="20" rx="2" fill="#5B3FA8"/><text x="695" y="250" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Proficiency by competency band</text><text x="695" y="272" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E5A73" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Share of graduates meeting the standard by day 30 and by day 90</text><rect x="1274" y="212" width="598" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="1294" y="234" width="4" height="20" rx="2" fill="#5B3FA8"/><text x="1308" y="250" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Competency vs first-month first-time right</text><text x="1308" y="272" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E5A73" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">One dot per graduate · days 1-30</text><rect x="48" y="637" width="597" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="68" y="659" width="4" height="20" rx="2" fill="#5B3FA8"/><text x="82" y="675" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Certified at the first attempt?</text><text x="82" y="697" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E5A73" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">First-time right by window: both certifications passed first time?</text><rect x="661" y="637" width="597" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="681" y="659" width="4" height="20" rx="2" fill="#5B3FA8"/><text x="695" y="675" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Watch list in training and retention</text><text x="695" y="697" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E5A73" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">90-day retention: was the trainee ever on the watch list?</text><rect x="1274" y="637" width="598" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="1294" y="659" width="4" height="20" rx="2" fill="#5B3FA8"/><text x="1308" y="675" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">What the data says</text><circle cx="1313" cy="720.5" r="3" fill="#5B3FA8"/><text x="1328" y="725" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Training predicts early performance, but only moderately: 24% of the</text><text x="1328" y="744.6" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">top third by final competency met the standard in their first 30</text><text x="1328" y="764.2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">days, against 8% of the bottom third.</text><circle cx="1313" cy="787.3" r="3" fill="#5B3FA8"/><text x="1328" y="791.7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">By day 90 most of the bottom third had caught up (72% proficient).</text><circle cx="1313" cy="814.8" r="3" fill="#5B3FA8"/><text x="1328" y="819.3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Passing both certifications first time goes with a faster start: 16%</text><text x="1328" y="838.9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">proficient by day 30, against 9%.</text><circle cx="1313" cy="862.0" r="3" fill="#5B3FA8"/><text x="1328" y="866.5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Trainees who were on the watch list were more likely to leave: 90.5%</text><text x="1328" y="886.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">still employed at day 90, against 96.6%.</text><circle cx="1313" cy="909.1" r="3" fill="#5B3FA8"/><text x="1328" y="913.6" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Individual variation is large: a training score is a reason to</text><text x="1328" y="933.2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17132B" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">support someone, not a verdict.</text><text x="1308" y="966" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#5E5A73" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Associations, not causes. Figures: all graduates, no filters.</text><text x="52" y="1068" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8A96A8" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Complete 30-day windows only. Small groups (e.g. one cohort's bottom third) are noisy; read differences of a few points with care.</text></svg>