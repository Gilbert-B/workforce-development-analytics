<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2=".35"><stop offset="0" stop-color="#071A33"/><stop offset="1" stop-color="#0B5CAD"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity=".07"/></pattern><radialGradient id="glow" cx="92%" cy="100%" r="55%"><stop offset="0" stop-color="#0B5CAD" stop-opacity=".07"/><stop offset="1" stop-color="#0B5CAD" stop-opacity="0"/></radialGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#0F1B2D" flood-opacity=".08"/></filter></defs><rect width="1920" height="1080" fill="#F2F5F9"/><rect width="1920" height="1080" fill="url(#glow)"/><rect x="0" y="0" width="1920" height="232" fill="url(#hero)"/><rect x="0" y="0" width="1920" height="232" fill="url(#dots)"/><circle cx="1760" cy="-30" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/><circle cx="1760" cy="-30" r="240" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5"/><circle cx="1760" cy="-30" r="330" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/><circle cx="1760" cy="-30" r="420" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1.5"/><rect x="48" y="34" width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity=".14" stroke="#FFFFFF" stroke-opacity=".25"/><g transform="translate(61,47) scale(1.0833333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13 6 5h12l3 8v6H3z"/><path d="M3 13h5l1.5 3h5L16 13h5"/></g><text x="120" y="52" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#BFD5F0" fill-opacity="1.0" letter-spacing="1.4" text-anchor="start">PAYMENT OPERATIONS PERFORMANCE · REPORT 02 OF 3</text><text x="120" y="90" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">About this report</text><rect x="1452" y="34" width="420" height="40" rx="20" fill="#FFFFFF" fill-opacity=".10" stroke="#FFFFFF" stroke-opacity=".22"/><rect x="48" y="212" width="904" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="68" y="234" width="4" height="20" rx="2" fill="#0B5CAD"/><text x="82" y="250" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">What it shows</text><circle cx="87" cy="299.1" r="3" fill="#0B5CAD"/><text x="102" y="304" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">A fictional payments operations team handles five kinds of payment exception: returned, duplicate,</text><text x="102" y="325.8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">failed validation, missing beneficiary and sanctions-screening hits.</text><circle cx="87" cy="354.6" r="3" fill="#0B5CAD"/><text x="102" y="359.5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">109 graduates of the training academy (Report 01) joined 40 tenured agents between Aug 2026 and</text><text x="102" y="381.2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Jun 2027.</text><circle cx="87" cy="410.1" r="3" fill="#0B5CAD"/><text x="102" y="415.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">The question: how quickly do new graduates reach the standard of experienced agents, and where</text><text x="102" y="436.8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">does quality slip?</text><rect x="968" y="212" width="904" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="988" y="234" width="4" height="20" rx="2" fill="#0B5CAD"/><text x="1002" y="250" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Key definitions</text><circle cx="1007" cy="299.1" r="3" fill="#0B5CAD"/><text x="1022" y="304" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">SLA met: FINAL resolution within the ORIGINAL target hours, with no pauses. Open cases are never</text><text x="1022" y="325.8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">counted as met or missed; they become 'overdue' once past their target.</text><circle cx="1007" cy="354.6" r="3" fill="#0B5CAD"/><text x="1022" y="359.5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">First-time right: resolved with no rework (no QA failure and no customer reopen).</text><circle cx="1007" cy="388.3" r="3" fill="#0B5CAD"/><text x="1022" y="393.2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">QA: a sample (25% in an agent's first 30 days, 10% after), scored on six weighted items; pass =</text><text x="1022" y="415.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">85+.</text><circle cx="1007" cy="443.8" r="3" fill="#0B5CAD"/><text x="1022" y="448.8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Tenure band: days from the agent's start to the day the case was received.</text><rect x="48" y="637" width="904" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="68" y="659" width="4" height="20" rx="2" fill="#0B5CAD"/><text x="82" y="675" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Where the data comes from</text><circle cx="87" cy="724.0" r="3" fill="#0B5CAD"/><text x="102" y="729" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Cases are JSON documents in MongoDB, as a case-management system would hold them.</text><circle cx="87" cy="757.8" r="3" fill="#0B5CAD"/><text x="102" y="762.8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">A Python ETL loads them incrementally into SQL Server (checkpoint on updated_at + id, idempotent,</text><text x="102" y="784.5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">bad documents rejected with a reason) and reconciles the counts.</text><circle cx="87" cy="813.3" r="3" fill="#0B5CAD"/><text x="102" y="818.2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">SQL views (rpt schema) feed one shared Power BI model used by all three reports.</text><rect x="968" y="637" width="904" height="409" rx="16" fill="#FFFFFF" filter="url(#shadow)"/><rect x="988" y="659" width="4" height="20" rx="2" fill="#0B5CAD"/><text x="1002" y="675" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Read with care</text><circle cx="1007" cy="724.0" r="3" fill="#0B5CAD"/><text x="1022" y="729" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">All people, cases and numbers are synthetic.</text><circle cx="1007" cy="757.8" r="3" fill="#0B5CAD"/><text x="1022" y="762.8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">Small slices (one agent, or one queue in one month) are noisy.</text><circle cx="1007" cy="791.5" r="3" fill="#0B5CAD"/><text x="1022" y="796.5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#0F1B2D" fill-opacity="1.0" letter-spacing="0.0" text-anchor="start">The benchmark compares like with like on team, queue and priority, but not on case difficulty.</text></svg>